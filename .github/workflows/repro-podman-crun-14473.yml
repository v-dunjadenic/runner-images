name: Repro 14473 - podman/crun mismatch

on:
  push:
    branches: [ test-podman-broken-on-20260726.254 ]
  workflow_dispatch:
    inputs:
      runners:
        description: 'JSON array of runner labels to test'
        required: false
        default: '["ubuntu-22.04", "ubuntu-22.04-arm", "ubuntu-24.04", "ubuntu-24.04-arm", "ubuntu-26.04"]'

env:
  TEST_IMAGE: docker.io/library/alpine

jobs:
  config:
    name: Resolve runner list
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.runners.outputs.list }}
    steps:
      - id: runners
        env:
          RUNNERS: ${{ inputs.runners || '["ubuntu-22.04", "ubuntu-22.04-arm", "ubuntu-24.04", "ubuntu-24.04-arm", "ubuntu-26.04"]' }}
        run: echo "list=$RUNNERS" >> "$GITHUB_OUTPUT"

  # Rollout dependent: fails when this job happens to land on an affected image.
  hosted-image:
    name: Hosted image on ${{ matrix.runner }}
    needs: config
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.config.outputs.runners) }}

    steps:
      - name: Show what the image ships
        run: |
          echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          podman --version
          podman info --format 'runtime: {{.Host.OCIRuntime.Path}}'
          for binary in /usr/bin/crun /usr/local/bin/crun; do
            [ -x "$binary" ] && echo "$binary -> $("$binary" --version | head -1)" || echo "$binary -> not present"
          done

      - name: Run a container
        run: podman run --rm "$TEST_IMAGE" echo hello

  # Runs the real build script from this branch, so it validates the committed change
  # (including its Pester tests). Green means the bug reproduces without the runtime
  # drop-in and is gone with it.
  build-script:
    name: Build script ${{ matrix.mode }} on ${{ matrix.runner }}
    needs: config
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.config.outputs.runners) }}
        mode: [ before-fix, after-fix ]
        # Ubuntu 26.04 keeps the apt podman/crun pair, so it has no drop-in to remove
        exclude:
          - runner: ubuntu-26.04
            mode: before-fix

    env:
      LOG: /tmp/repro-14473.log

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Stage the build environment
        run: |
          echo 'APT::Get::Assume-Yes "true";' | sudo tee /etc/apt/apt.conf.d/90assumeyes

          # Invoke-PesterTests only ever loads /imagegeneration/tests, and the hosted
          # image ships its own copy of the tests and helpers, so stage this branch
          # over them. Get-ToolsetContent needs INSTALLER_SCRIPT_FOLDER/toolset.json.
          release=$(lsb_release -rs | tr -d '.')
          arch_suffix=""
          if [ "$(uname -m)" = "aarch64" ]; then
            arch_suffix="-arm64"
          fi

          sudo mkdir -p /imagegeneration/tests /imagegeneration/helpers /imagegeneration/installers
          sudo cp images/ubuntu/scripts/tests/* /imagegeneration/tests/
          sudo cp images/ubuntu/scripts/helpers/* /imagegeneration/helpers/
          sudo cp "images/ubuntu/toolsets/toolset-${release}${arch_suffix}.json" /imagegeneration/installers/toolset.json

          sudo chmod +x /imagegeneration/helpers/invoke-tests.sh
          sudo ln -sf /imagegeneration/helpers/invoke-tests.sh /usr/local/bin/invoke_tests

          # The hosted image already carries podman state created by its own older
          # podman, which podman 5.8.4 cannot reuse ("failed to open 2048 locks
          # in /libpod_lock: numerical result out of range").
          sudo rm -f /dev/shm/libpod_lock /dev/shm/libpod_rootless_lock_*

      - name: Run install-container-tools.sh
        run: |
          set -o pipefail
          sudo env -u XDG_RUNTIME_DIR \
            HELPER_SCRIPTS=/imagegeneration/helpers \
            INSTALLER_SCRIPT_FOLDER=/imagegeneration/installers \
            DEBIAN_FRONTEND=noninteractive \
            bash images/ubuntu/scripts/build/install-container-tools.sh 2>&1 | tee -a "$LOG"

      - name: Remove the runtime drop-in again
        if: matrix.mode == 'before-fix'
        run: sudo rm -f /etc/containers/containers.conf.d/99-fix-runtime.conf

      - name: Use podman and buildah
        id: containers
        continue-on-error: ${{ matrix.mode == 'before-fix' }}
        run: |
          set -o pipefail
          {
            # the script ran as root, so drop the state it left in the user runtime dir
            runtime_dir="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
            sudo rm -rf "$runtime_dir/crun" "$runtime_dir/libpod"

            podman info --format 'runtime: {{.Host.OCIRuntime.Path}}'
            podman run --rm "$TEST_IMAGE" echo hello

            context=$(mktemp -d)
            printf 'FROM %s\nRUN echo hello\n' "$TEST_IMAGE" > "$context/Containerfile"
            podman build --tag repro-14473 "$context"

            container=$(buildah from "$TEST_IMAGE")
            buildah run "$container" -- echo hello
            buildah rm "$container"
          } 2>&1 | tee -a "$LOG"

      - name: Fail if containers worked without the fix
        if: matrix.mode == 'before-fix' && steps.containers.outcome == 'success'
        run: |
          echo "podman worked without the runtime drop-in, the issue no longer reproduces"
          exit 1

      - name: Collect diagnostics
        if: always()
        run: |
          {
            echo "===== ${{ matrix.mode }} on ${ImageOS:-unknown} ${ImageVersion:-unknown} ====="
            podman --version
            buildah --version
            podman info --format 'runtime: {{.Host.OCIRuntime.Path}} {{.Host.OCIRuntime.Version}}'
            for binary in /usr/bin/crun /usr/local/bin/crun; do
              [ -x "$binary" ] && echo "$binary -> $("$binary" --version | head -1)" || echo "$binary -> not present"
            done
            grep -r . /etc/containers/containers.conf.d || echo "no drop-ins"
          } >> "$LOG" 2>&1 || true

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mode }}-${{ matrix.runner }}
          path: ${{ env.LOG }}
