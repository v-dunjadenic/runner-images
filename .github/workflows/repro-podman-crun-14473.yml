name: Repro 14473 - podman/crun mismatch

on:
  workflow_dispatch:
    inputs:
      runners:
        description: 'JSON array of runner labels to test'
        required: false
        default: '["ubuntu-22.04", "ubuntu-24.04", "ubuntu-24.04-arm", "ubuntu-26.04"]'

jobs:
  repro:
    name: Repro on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}

    env:
      RUNNER_LABEL: ${{ matrix.runner }}

    steps:
      - name: Print image version
        run: |
          echo "Runner label: $RUNNER_LABEL"
          echo "Image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          cat /imagegeneration/imagedata.json 2>/dev/null || echo "imagedata.json not available"

      - name: Collect podman and crun diagnostics
        run: |
          podman --version
          podman info --format 'OCI runtime: {{.Host.OCIRuntime.Name}} {{.Host.OCIRuntime.Path}} {{.Host.OCIRuntime.Version}}'

          echo "crun on PATH: $(command -v crun || echo none)"
          for binary in /usr/bin/crun /usr/local/bin/crun /usr/bin/runc /usr/local/bin/runc; do
            if [ -x "$binary" ]; then
              echo "$binary -> $("$binary" --version | head -1)"
            else
              echo "$binary -> not present"
            fi
          done

          echo "Owner of /usr/bin/crun:"
          dpkg -S /usr/bin/crun 2>/dev/null || echo "not owned by an apt package"

          echo "containers.conf drop-ins:"
          ls -la /etc/containers/containers.conf.d 2>/dev/null || echo "none"
          grep -rn 'runtime' /etc/containers/containers.conf /etc/containers/containers.conf.d 2>/dev/null || echo "no runtime overrides"

      - name: Reproduce - podman run
        id: podman_run
        continue-on-error: true
        run: podman run --rm docker.io/library/alpine echo hello

      - name: Reproduce - podman build
        id: podman_build
        continue-on-error: true
        run: |
          printf 'FROM docker.io/library/alpine\nRUN echo hello\n' > Containerfile
          podman build --tag repro-14473 .

      - name: Report result
        run: |
          runtime_path=$(podman info --format '{{.Host.OCIRuntime.Path}}')
          runtime_version=$("$runtime_path" --version | head -1)
          path_crun=$(command -v crun || echo none)

          {
            echo "### $RUNNER_LABEL (${ImageVersion:-unknown})"
            echo ""
            echo "| Check | Value |"
            echo "| --- | --- |"
            echo "| podman | $(podman --version) |"
            echo "| runtime selected by podman | $runtime_path ($runtime_version) |"
            echo "| crun resolved via PATH | $path_crun |"
            echo "| podman run | ${{ steps.podman_run.outcome }} |"
            echo "| podman build | ${{ steps.podman_build.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.podman_run.outcome }}" = "failure" ] || [ "${{ steps.podman_build.outcome }}" = "failure" ]; then
            echo "Issue #14473 reproduced on $RUNNER_LABEL: podman uses $runtime_path ($runtime_version)"
            exit 1
          fi

          echo "Not reproduced on $RUNNER_LABEL"

  workaround:
    name: Workaround on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}

    env:
      RUNNER_LABEL: ${{ matrix.runner }}

    steps:
      - name: Point podman at the bundled crun
        run: |
          if [ ! -x /usr/local/bin/crun ]; then
            echo "/usr/local/bin/crun is not present on $RUNNER_LABEL, keeping the default runtime"
            exit 0
          fi
          sudo mkdir -p /etc/containers/containers.conf.d
          printf '[engine]\nruntime = "crun"\n\n[engine.runtimes]\ncrun = ["/usr/local/bin/crun"]\n' \
            | sudo tee /etc/containers/containers.conf.d/99-crun-path.conf
          podman info --format 'OCI runtime: {{.Host.OCIRuntime.Path}} {{.Host.OCIRuntime.Version}}'

      - name: Verify podman run
        run: podman run --rm docker.io/library/alpine echo hello

      - name: Verify podman build
        run: |
          printf 'FROM docker.io/library/alpine\nRUN echo hello\n' > Containerfile
          podman build --tag repro-14473-workaround .
