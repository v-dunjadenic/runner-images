name: Repro 14473 - podman/crun mismatch

on:
  push:
    branches: [ test-podman-broken-on-20260726.254 ]
  workflow_dispatch:
    inputs:
      runners:
        description: 'JSON array of runner labels to test'
        required: false
        default: '["ubuntu-22.04", "ubuntu-24.04", "ubuntu-24.04-arm", "ubuntu-26.04"]'

jobs:
  hosted-image:
    name: Hosted image as-is on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners || '["ubuntu-22.04", "ubuntu-24.04", "ubuntu-24.04-arm", "ubuntu-26.04"]') }}

    env:
      RUNNER_LABEL: ${{ matrix.runner }}

    steps:
      - name: Print image version
        run: |
          echo "Runner label: $RUNNER_LABEL"
          echo "Image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          cat /imagegeneration/imagedata.json 2>/dev/null || echo "imagedata.json not available"

      - name: Collect podman and crun diagnostics
        run: |
          podman --version
          podman info --format 'OCI runtime: {{.Host.OCIRuntime.Name}} {{.Host.OCIRuntime.Path}} {{.Host.OCIRuntime.Version}}'

          echo "crun on PATH: $(command -v crun || echo none)"
          for binary in /usr/bin/crun /usr/local/bin/crun /usr/bin/runc /usr/local/bin/runc; do
            if [ -x "$binary" ]; then
              echo "$binary -> $("$binary" --version | head -1)"
            else
              echo "$binary -> not present"
            fi
          done

          echo "Owner of /usr/bin/crun:"
          dpkg -S /usr/bin/crun 2>/dev/null || echo "not owned by an apt package"

          echo "containers.conf drop-ins:"
          ls -la /etc/containers/containers.conf.d 2>/dev/null || echo "none"
          grep -rn 'runtime' /etc/containers/containers.conf /etc/containers/containers.conf.d 2>/dev/null || echo "no runtime overrides"

      - name: Reproduce - podman run
        id: podman_run
        continue-on-error: true
        run: podman run --rm docker.io/library/alpine echo hello

      - name: Reproduce - podman build
        id: podman_build
        continue-on-error: true
        run: |
          printf 'FROM docker.io/library/alpine\nRUN echo hello\n' > Containerfile
          podman build --tag repro-14473 .

      - name: Report result
        run: |
          runtime_path=$(podman info --format '{{.Host.OCIRuntime.Path}}')
          runtime_version=$("$runtime_path" --version | head -1)
          path_crun=$(command -v crun || echo none)

          {
            echo "### Hosted image: $RUNNER_LABEL (${ImageVersion:-unknown})"
            echo ""
            echo "| Check | Value |"
            echo "| --- | --- |"
            echo "| podman | $(podman --version) |"
            echo "| runtime selected by podman | $runtime_path ($runtime_version) |"
            echo "| crun resolved via PATH | $path_crun |"
            echo "| podman run | ${{ steps.podman_run.outcome }} |"
            echo "| podman build | ${{ steps.podman_build.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.podman_run.outcome }}" = "failure" ] || [ "${{ steps.podman_build.outcome }}" = "failure" ]; then
            echo "REPRODUCED on $RUNNER_LABEL: podman uses $runtime_path ($runtime_version)"
            exit 1
          fi

          echo "NOT REPRODUCED on $RUNNER_LABEL: image ${ImageVersion:-unknown} is not the affected generation"

  # Deterministic: recreates the pairing that install-container-tools.sh produces
  # (pinned podman 5.8.4 static bundle in /usr/local, distro crun left in /usr/bin),
  # so it does not depend on which image generation the job lands on.
  forced:
    name: Forced ${{ matrix.mode }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners || '["ubuntu-22.04", "ubuntu-24.04", "ubuntu-24.04-arm", "ubuntu-26.04"]') }}
        mode: [ as-built, with-fix ]

    env:
      RUNNER_LABEL: ${{ matrix.runner }}
      MODE: ${{ matrix.mode }}
      PODMAN_STATIC_TAG: v5.8.4
      PODMAN_STATIC_SHA256_AMD64: a58765fe8be6ab3fb79f892f1a027b4ce4a7e8eb589df1ef960c167cbde08d69
      PODMAN_STATIC_SHA256_ARM64: a2f6b73cc0f7018e2e8518338a4ec27db70148e1af86e16719235605aefd1df3

    steps:
      - name: Print image version
        run: |
          echo "Image: ${ImageOS:-unknown} ${ImageVersion:-unknown} ($RUNNER_LABEL, mode $MODE)"

      - name: Ensure the distro crun is present in /usr/bin
        run: |
          if [ ! -x /usr/bin/crun ]; then
            sudo apt-get update
            sudo apt-get install -y crun
          fi
          echo "/usr/bin/crun -> $(/usr/bin/crun --version | head -1)"
          dpkg -S /usr/bin/crun 2>/dev/null || echo "/usr/bin/crun not owned by an apt package"

      - name: Install the pinned podman static bundle
        run: |
          case "$(uname -m)" in
            x86_64)  arch=amd64; checksum=$PODMAN_STATIC_SHA256_AMD64 ;;
            aarch64) arch=arm64; checksum=$PODMAN_STATIC_SHA256_ARM64 ;;
            *) echo "unsupported architecture $(uname -m)"; exit 1 ;;
          esac

          archive="podman-linux-${arch}.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/mgoltzsche/podman-static/releases/download/${PODMAN_STATIC_TAG}/${archive}"
          echo "${checksum}  ${archive}" | sha256sum --check

          sudo tar -xzf "$archive" -C / --strip-components=1 \
            "podman-linux-${arch}/usr" "podman-linux-${arch}/etc"
          rm -f "$archive"

          # Same AppArmor profile the build script installs, otherwise rootless podman
          # from /usr/local/bin fails with "failed to reexec: Permission denied".
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = "1" ]; then
            sudo tee /etc/apparmor.d/podman > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          profile podman /usr/{bin,local/bin}/podman flags=(unconfined) {
            userns,

            include if exists <local/podman>
          }
          PROFILE
            sudo apparmor_parser -r -W /etc/apparmor.d/podman
          fi

          printf "[registries.search]\nregistries = ['docker.io', 'quay.io']\n" | sudo tee /etc/containers/registries.conf
          sudo mkdir -p /etc/containers/containers.conf.d
          printf '[network]\nfirewall_driver = "iptables"\n' | sudo tee /etc/containers/containers.conf.d/99-fix-firewall.conf

      - name: Apply candidate fix - pin the runtime to the bundled crun
        if: matrix.mode == 'with-fix'
        run: |
          printf '[engine]\nruntime = "crun"\n\n[engine.runtimes]\ncrun = ["/usr/local/bin/crun"]\n' \
            | sudo tee /etc/containers/containers.conf.d/99-crun-path.conf

      - name: Collect podman and crun diagnostics
        run: |
          podman --version
          podman info --format 'OCI runtime: {{.Host.OCIRuntime.Name}} {{.Host.OCIRuntime.Path}} {{.Host.OCIRuntime.Version}}'
          for binary in /usr/bin/crun /usr/local/bin/crun /usr/local/libexec/podman/crun; do
            if [ -x "$binary" ]; then
              echo "$binary -> $("$binary" --version | head -1)"
            else
              echo "$binary -> not present"
            fi
          done
          echo "crun on PATH: $(command -v crun || echo none)"

      - name: Reproduce - podman run
        id: podman_run
        continue-on-error: true
        run: podman run --rm docker.io/library/alpine echo hello

      - name: Reproduce - podman build
        id: podman_build
        continue-on-error: true
        run: |
          printf 'FROM docker.io/library/alpine\nRUN echo hello\n' > Containerfile
          podman build --tag "repro-14473-$MODE" .

      - name: Report result
        run: |
          runtime_path=$(podman info --format '{{.Host.OCIRuntime.Path}}')
          runtime_version=$("$runtime_path" --version | head -1)
          failed=no
          if [ "${{ steps.podman_run.outcome }}" = "failure" ] || [ "${{ steps.podman_build.outcome }}" = "failure" ]; then
            failed=yes
          fi

          {
            echo "### Forced $MODE: $RUNNER_LABEL (${ImageVersion:-unknown})"
            echo ""
            echo "| Check | Value |"
            echo "| --- | --- |"
            echo "| podman | $(podman --version) |"
            echo "| runtime selected by podman | $runtime_path ($runtime_version) |"
            echo "| /usr/bin/crun | $(/usr/bin/crun --version | head -1) |"
            echo "| podman run | ${{ steps.podman_run.outcome }} |"
            echo "| podman build | ${{ steps.podman_build.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$MODE" = "as-built" ]; then
            if [ "$failed" = "yes" ]; then
              echo "REPRODUCED on $RUNNER_LABEL: podman uses $runtime_path ($runtime_version)"
              exit 1
            fi
            echo "NOT REPRODUCED on $RUNNER_LABEL: $runtime_path is $runtime_version, which accepts ociVersion 1.2.1"
            exit 0
          fi

          if [ "$failed" = "yes" ]; then
            echo "FIX FAILED on $RUNNER_LABEL: podman still uses $runtime_path ($runtime_version)"
            exit 1
          fi
          echo "FIX HOLDS on $RUNNER_LABEL: podman uses $runtime_path ($runtime_version)"

  # Executes the real build script from this branch, so it validates the committed
  # change (including its Pester tests) instead of a hand-written config.
  verify-build-script:
    name: Verify build script on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners || '["ubuntu-22.04", "ubuntu-24.04", "ubuntu-24.04-arm", "ubuntu-26.04"]') }}

    env:
      RUNNER_LABEL: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Recreate the parts of the build environment the script relies on
        run: |
          echo 'APT::Get::Assume-Yes "true";' | sudo tee /etc/apt/apt.conf.d/90assumeyes
          sudo ln -sf "$GITHUB_WORKSPACE/images/ubuntu/scripts/helpers/invoke-tests.sh" /usr/local/bin/invoke_tests

      - name: Run install-container-tools.sh
        run: |
          sudo env HELPER_SCRIPTS="$GITHUB_WORKSPACE/images/ubuntu/scripts/helpers" \
            DEBIAN_FRONTEND=noninteractive \
            bash images/ubuntu/scripts/build/install-container-tools.sh

      - name: Verify the runtime configuration
        run: |
          if [ -f /etc/containers/containers.conf.d/99-fix-runtime.conf ]; then
            cat /etc/containers/containers.conf.d/99-fix-runtime.conf
          else
            echo "no runtime drop-in on $RUNNER_LABEL (expected on Ubuntu 26.04)"
          fi
          podman info --format 'OCI runtime: {{.Host.OCIRuntime.Path}} {{.Host.OCIRuntime.Version}}'

      - name: Verify podman run
        run: podman run --rm docker.io/library/alpine echo hello

      - name: Verify podman build
        run: |
          printf 'FROM docker.io/library/alpine\nRUN echo hello\n' > Containerfile
          podman build --tag verify-14473 .

      - name: Verify buildah still works
        run: |
          container=$(buildah from docker.io/library/alpine)
          buildah run "$container" -- echo hello
          buildah rm "$container"
