name: Verify toolcache prerelease filtering

on:
  push:
    branches:
      - test-14011-version-parsing-fix
      
permissions:
  contents: read

jobs:
  verify-toolcache-filter:
    name: Verify toolcache filter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify installer implementations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerPaths = @(
            'images/ubuntu/scripts/build/Install-Toolset.ps1',
            'images/windows/scripts/build/Install-Toolset.ps1',
            'images/macos/scripts/build/Install-Toolset.ps1'
          )

          foreach ($installerPath in $installerPaths) {
            $installer = Get-Content -Raw $installerPath
            if ($installer -notmatch '\$_\.version -as \[version\] -ne \$null') {
              throw "$installerPath does not reject versions that cannot be parsed as System.Version"
            }

            if ($installer -match "-notmatch '-\[a-zA-Z\]'") {
              throw "$installerPath still contains the incomplete prerelease regex"
            }
          }

      - name: Verify prerelease selection edge cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Production predicate from Install-Toolset.ps1 after actions/runner-images#14005 and #14007
          function Select-Asset {
            param($Assets, $ToolVersion, $Platform = 'linux', $Arch = 'x64', $PlatformVersion = '22.04')
            $Assets |
              Where-Object { ($_.version -like $ToolVersion) -and ($_.version -as [version] -ne $null) } |
              Select-Object -ExpandProperty files |
              Where-Object { ($_.platform -eq $Platform) -and ($_.arch -eq $Arch) -and ($_.platform_version -eq $PlatformVersion) } |
              Select-Object -First 1
          }

          # Predicate as it existed before the fix, used to prove the fixtures reproduce #14011
          function Select-AssetBeforeFix {
            param($Assets, $ToolVersion)
            $Assets |
              Where-Object version -like $ToolVersion |
              Select-Object -ExpandProperty files |
              Where-Object { ($_.platform -eq 'linux') -and ($_.arch -eq 'x64') -and ($_.platform_version -eq '22.04') } |
              Select-Object -First 1
          }

          function New-Asset {
            param($Version, $Platform = 'linux', $Arch = 'x64', $PlatformVersion = '22.04')
            [pscustomobject] @{
              version = $Version
              files = @([pscustomobject] @{
                filename = "$Version.tar.gz"
                platform = $Platform
                arch = $Arch
                platform_version = $PlatformVersion
              })
            }
          }

          function Assert-Selection {
            param($Name, $Assets, $ToolVersion, $Expected)
            $selectedAsset = Select-Asset $Assets $ToolVersion
            $selected = if ($null -eq $selectedAsset) { $null } else { $selectedAsset.filename }
            $expectedFile = if ($null -eq $Expected) { $null } else { "$Expected.tar.gz" }

            if ($selected -ne $expectedFile) {
              throw "${Name}: expected '$expectedFile', selected '$selected'"
            }

            Write-Host "PASS ${Name} -> $(if ($null -eq $selected) { '<no asset>' } else { $selected })"
          }

          $cases = @(
            @{ Name = 'RC before stable'; Wildcard = '3.14.*'; Versions = @('3.14.5-rc.1', '3.14.5'); Expected = '3.14.5' }
            @{ Name = 'Beta before stable'; Wildcard = '3.14.*'; Versions = @('3.14.5-beta.1', '3.14.5'); Expected = '3.14.5' }
            @{ Name = 'Alpha before stable'; Wildcard = '3.14.*'; Versions = @('3.14.5-alpha.1', '3.14.5'); Expected = '3.14.5' }
            @{ Name = 'Numeric prerelease before stable'; Wildcard = '3.14.*'; Versions = @('3.14.5-0', '3.14.5'); Expected = '3.14.5' }
            @{ Name = 'Numeric dotted prerelease before stable'; Wildcard = '3.14.*'; Versions = @('3.14.5-1.2', '3.14.5'); Expected = '3.14.5' }
            @{ Name = 'Build metadata is rejected'; Wildcard = '3.14.*'; Versions = @('3.14.5+build.1', '3.14.5'); Expected = '3.14.5' }
            @{ Name = 'Version with v prefix is rejected by System.Version'; Wildcard = '3.14.*'; Versions = @('v3.14.5', '3.14.5'); Expected = '3.14.5' }
            @{ Name = 'Stable wildcard selects first stable version'; Wildcard = '3.14.*'; Versions = @('3.14.4', '3.14.5'); Expected = '3.14.4' }
            @{ Name = 'Prerelease-only version line yields no asset'; Wildcard = '3.15.*'; Versions = @('3.15.0-rc.1', '3.15.0-beta.1'); Expected = $null }
            @{ Name = 'All candidates unparseable yields no asset'; Wildcard = '3.14.*'; Versions = @('3.14.5-rc.1', '3.14.5-rc.2'); Expected = $null }
            @{ Name = 'Four-part version is accepted'; Wildcard = '3.14.*'; Versions = @('3.14.5.1'); Expected = '3.14.5.1' }
          )

          foreach ($case in $cases) {
            $assets = @($case.Versions | ForEach-Object { New-Asset $_ })
            Assert-Selection $case.Name $assets $case.Wildcard $case.Expected
          }

          # Control test: the fixture must still reproduce the original defect under the pre-fix
          # predicate, otherwise these tests would pass even if the fix were reverted.
          $regressionAssets = @('3.14.5-rc.1', '3.14.5') | ForEach-Object { New-Asset $_ }
          $beforeFix = Select-AssetBeforeFix $regressionAssets '3.14.*'
          if ($beforeFix.filename -ne '3.14.5-rc.1.tar.gz') {
            throw "Control test no longer reproduces #14011: pre-fix predicate selected '$($beforeFix.filename)'"
          }
          Write-Host "PASS Control -> pre-fix predicate selects $($beforeFix.filename) while the current predicate rejects it"

          # A parseable version must still be rejected when no file matches the target image
          $archMismatch = @(New-Asset '3.14.7' 'linux' 'arm64' '22.04')
          if ($null -ne (Select-Asset $archMismatch '3.14.*')) {
            throw 'Asset with mismatched arch must not be selected'
          }

          $platformVersionMismatch = @(New-Asset '3.14.7' 'linux' 'x64' '24.04')
          if ($null -ne (Select-Asset $platformVersionMismatch '3.14.*')) {
            throw 'Asset with mismatched platform_version must not be selected'
          }

          $platformMismatch = @(New-Asset '3.14.7' 'win32' 'x64' '22.04')
          if ($null -ne (Select-Asset $platformMismatch '3.14.*')) {
            throw 'Asset with mismatched platform must not be selected'
          }
          Write-Host 'PASS File filter rejects mismatched platform, arch and platform_version'

          # Wildcards are dot anchored, so 3.1.* must not leak into the adjacent 3.14.x line.
          $adjacentLine = Select-Asset (@('3.14.5', '3.1.5') | ForEach-Object { New-Asset $_ }) '3.1.*'
          if ($adjacentLine.filename -ne '3.1.5.tar.gz') {
            throw "Wildcard 3.1.* must not match the 3.14.x line, but selected '$($adjacentLine.filename)'"
          }
          Write-Host 'PASS Wildcard 3.1.* is dot anchored and does not match 3.14.x'

      - name: Verify toolcache report sorting
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # This is the sort that failed in #14011. It must tolerate any directory name.
          $directoryNames = @('3.14.7', '3.9.23', '3.14.5', '3.14.5-rc.1', '3.15.0-beta.1', 'x64')
          $sorted = @($directoryNames | Sort-Object { ($_ -split '-', 2)[0] -as [Version] }, { $_ })

          if ($sorted.Count -ne $directoryNames.Count) {
            throw "Sorting dropped entries: $($sorted -join ', ')"
          }

          $stableOrder = @($sorted | Where-Object { $_ -as [Version] }) -join ','
          if ($stableOrder -ne '3.9.23,3.14.5,3.14.7') {
            throw "Stable versions are not ordered correctly: $stableOrder"
          }

          Write-Host "Sorted toolcache directory names: $($sorted -join ', ')"

      - name: Audit live versions manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifests = @(
            'https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json',
            'https://raw.githubusercontent.com/actions/node-versions/main/versions-manifest.json',
            'https://raw.githubusercontent.com/actions/go-versions/main/versions-manifest.json'
          )

          foreach ($manifestUrl in $manifests) {
            $assets = Invoke-RestMethod $manifestUrl
            $matchingVersions = @($assets | Where-Object { $_.version -like '*.*.*' })
            $invalidVersions = @($matchingVersions | Where-Object { $_.version -as [version] -eq $null })

            Write-Host "$manifestUrl contains $($matchingVersions.Count) three-part version entries and $($invalidVersions.Count) prerelease/non-System.Version entries"

            foreach ($invalidVersion in $invalidVersions) {
              $stableVersion = $invalidVersion.version -replace '-.*$', ''
              if ($stableVersion -and ($assets | Where-Object { $_.version -eq $stableVersion })) {
                Write-Host "Confirmed prerelease candidate is paired with stable version: $($invalidVersion.version) / $stableVersion"
              }
            }

            if ($manifestUrl -like '*python-versions*') {
              $parseableVersions = @($assets | Where-Object { ($_.version -like '3.14.*') -and ($_.version -as [version] -ne $null) })
              $selectedPython = $parseableVersions | Select-Object -First 1

              if ($null -eq $selectedPython) {
                throw 'The live Python manifest has no parseable 3.14.* version'
              }

              # Selection relies on the manifest being published newest first and never sorts,
              # so a reordering upstream would silently install an older release.
              $highestPython = $parseableVersions | Sort-Object { [version] $_.version } -Descending | Select-Object -First 1
              if ($selectedPython.version -ne $highestPython.version) {
                throw "Manifest ordering changed: installers would select $($selectedPython.version) instead of the newest stable $($highestPython.version)"
              }

              $beforeFixSelection = $assets | Where-Object { $_.version -like '3.14.*' } | Select-Object -First 1
              if ($beforeFixSelection.version -eq $selectedPython.version) {
                Write-Host "NOTE: live data cannot distinguish the fix today because the newest 3.14.* entry ($($selectedPython.version)) is already stable. The synthetic control test covers this."
              } else {
                Write-Host "Live data distinguishes the fix: pre-fix would select $($beforeFixSelection.version), current logic selects $($selectedPython.version)"
              }

              Write-Host "Live Python 3.14.* selection is $($selectedPython.version)"
            }
          }

      - name: Export verification artifacts
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactPath = Join-Path $env:RUNNER_TEMP 'toolcache-prerelease-verification'
          $manifestPath = Join-Path $artifactPath 'manifests'
          $sourcePath = Join-Path $artifactPath 'source'
          New-Item -ItemType Directory -Force -Path $manifestPath, $sourcePath | Out-Null

          Copy-Item '.github/workflows/verify-toolcache-prereleases.yml' (Join-Path $sourcePath 'verify-toolcache-prereleases.yml')
          Copy-Item 'images/ubuntu/scripts/build/Install-Toolset.ps1' (Join-Path $sourcePath 'ubuntu-Install-Toolset.ps1')
          Copy-Item 'images/windows/scripts/build/Install-Toolset.ps1' (Join-Path $sourcePath 'windows-Install-Toolset.ps1')
          Copy-Item 'images/macos/scripts/build/Install-Toolset.ps1' (Join-Path $sourcePath 'macos-Install-Toolset.ps1')
          Copy-Item 'images/ubuntu/scripts/docs-gen/SoftwareReport.CachedTools.psm1' (Join-Path $sourcePath 'ubuntu-SoftwareReport.CachedTools.psm1')
          Copy-Item 'images/windows/scripts/docs-gen/SoftwareReport.CachedTools.psm1' (Join-Path $sourcePath 'windows-SoftwareReport.CachedTools.psm1')
          Copy-Item 'images/macos/scripts/docs-gen/SoftwareReport.Toolcache.psm1' (Join-Path $sourcePath 'macos-SoftwareReport.Toolcache.psm1')

          $manifestUrls = [ordered]@{
            python = 'https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json'
            node = 'https://raw.githubusercontent.com/actions/node-versions/main/versions-manifest.json'
            go = 'https://raw.githubusercontent.com/actions/go-versions/main/versions-manifest.json'
          }

          $report = [System.Collections.Generic.List[string]]::new()
          $report.Add('# Toolcache prerelease verification')
          $report.Add('')
          $report.Add("- Workflow: $env:GITHUB_WORKFLOW")
          $report.Add("- Run: $env:GITHUB_RUN_ID")
          $report.Add("- Commit: $(git rev-parse HEAD)")
          $report.Add("- Ref: $env:GITHUB_REF")
          $report.Add("- Job: $env:GITHUB_JOB")
          $report.Add('')

          foreach ($manifest in $manifestUrls.GetEnumerator()) {
            $manifestFile = Join-Path $manifestPath "$($manifest.Key)-versions-manifest.json"
            $assets = Invoke-RestMethod $manifest.Value
            $assets | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8 $manifestFile

            $matchingVersions = @($assets | Where-Object { $_.version -like '*.*.*' })
            $invalidVersions = @($matchingVersions | Where-Object { $_.version -as [version] -eq $null })
            $report.Add("## $($manifest.Key)")
            $report.Add('')
            $report.Add("- Manifest: $($manifest.Value)")
            $report.Add("- Three-part versions: $($matchingVersions.Count)")
            $report.Add("- Non-System.Version entries: $($invalidVersions.Count)")

            if ($invalidVersions.Count -gt 0) {
              $report.Add('- Non-System.Version entries:')
              foreach ($invalidVersion in $invalidVersions) {
                $stableVersion = $invalidVersion.version -replace '-.*$', ''
                $hasStableVersion = $null -ne ($assets | Where-Object { $_.version -eq $stableVersion } | Select-Object -First 1)
                $report.Add("  - $($invalidVersion.version) (stable counterpart present: $hasStableVersion)")
              }
            }

            if ($manifest.Key -eq 'python') {
              $selectedPython = $assets |
                Where-Object { ($_.version -like '3.14.*') -and ($_.version -as [version] -ne $null) } |
                Select-Object -First 1
              $selectedVersion = if ($null -eq $selectedPython) { '<none>' } else { $selectedPython.version }
              $report.Add("- Parseable Python 3.14.* selection: $selectedVersion")
            }

            $report.Add('')
          }

          $report | Set-Content -Encoding utf8 (Join-Path $artifactPath 'verification-report.md')
          Set-Content -Encoding utf8 -Path (Join-Path $artifactPath 'git-status.txt') -Value (git status --short | Out-String)

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolcache-prerelease-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/toolcache-prerelease-verification
          if-no-files-found: error
          retention-days: 14
