name: Repro - Appx dependency missing

on:
  push:
    branches-ignore:
      - main
    paths:
      - ".github/workflows/repro-appx-missing-dependency.yml"
      - ".github/repro/appx-dependency/**"
  workflow_dispatch:
    inputs:
      solution_glob:
        description: "Build target path/glob (for example: **/*.slnx, **/*.sln, or **/*.wapproj)"
        required: true
        default: ".github/repro/appx-dependency/ReproAppxDependency.slnx"
      appx_package_dir:
        description: "Directory where Appx output is written"
        required: true
        default: "appx-out"
      dependency_dll:
        description: "Dependency DLL to verify inside produced appx/msix"
        required: true
        default: "MahApps.Metro.dll"

env:
  REPRO_TARGET_GLOB: ${{ github.event_name == 'workflow_dispatch' && inputs.solution_glob || '.github/repro/appx-dependency/ReproAppxDependency.slnx' }}
  REPRO_APPX_PACKAGE_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.appx_package_dir || 'appx-out' }}
  REPRO_DEPENDENCY_DLL: ${{ github.event_name == 'workflow_dispatch' && inputs.dependency_dll || 'MahApps.Metro.dll' }}

jobs:
  build-and-verify:
    name: ${{ matrix.image }} / SDK ${{ matrix.dotnet_sdk }}
    runs-on: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - windows-2022
          - windows-2025-vs2026
        dotnet_sdk:
          - floating
          - "10.0.107"
          - "10.0.108" 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate valid Appx logo assets for repro sample
        shell: pwsh
        run: |
          $assetRoot = Join-Path $env:GITHUB_WORKSPACE ".github\repro\appx-dependency\src\ReproPackaging\Assets"
          if (-not (Test-Path $assetRoot)) {
            Write-Host "Repro asset folder not found, skipping generated logos: $assetRoot"
            exit 0
          }

          Add-Type -AssemblyName System.Drawing

          function New-LogoPng {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Path,
              [Parameter(Mandatory = $true)]
              [int]$Width,
              [Parameter(Mandatory = $true)]
              [int]$Height
            )

            $bmp = New-Object System.Drawing.Bitmap($Width, $Height)
            $gfx = [System.Drawing.Graphics]::FromImage($bmp)
            $gfx.Clear([System.Drawing.Color]::FromArgb(255, 0, 120, 212))
            $bmp.Save($Path, [System.Drawing.Imaging.ImageFormat]::Png)
            $gfx.Dispose()
            $bmp.Dispose()
          }

          New-Item -Path $assetRoot -ItemType Directory -Force | Out-Null
          New-LogoPng -Path (Join-Path $assetRoot "StoreLogo.png") -Width 50 -Height 50
          New-LogoPng -Path (Join-Path $assetRoot "Square44x44Logo.png") -Width 44 -Height 44
          New-LogoPng -Path (Join-Path $assetRoot "Square150x150Logo.png") -Width 150 -Height 150
          New-LogoPng -Path (Join-Path $assetRoot "Wide310x150Logo.png") -Width 310 -Height 150

          Write-Host "Generated valid Appx logo assets in: $assetRoot"

      - name: Show runner and VS/MSBuild info
        shell: pwsh
        run: |
          Write-Host "Runner image: $env:ImageOS"
          Write-Host "Image version: $env:ImageVersion"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found at $vswhere"
          }

          Write-Host "--- Installed Visual Studio instances ---"
          & $vswhere -all -products * -requires Microsoft.Component.MSBuild -requires Microsoft.VisualStudio.ComponentGroup.MSIX.Packaging -format json | Out-File -FilePath vs-instances.json -Encoding utf8
          Get-Content .\vs-instances.json

          $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -requires Microsoft.VisualStudio.ComponentGroup.MSIX.Packaging -property installationPath
          if (-not $installPath) {
            throw "No Visual Studio installation with MSBuild and Windows App Packaging/MSIX support was found"
          }

          $msbuild = Join-Path $installPath "MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path $msbuild)) {
            throw "MSBuild.exe not found at $msbuild"
          }

          Write-Host "MSBuild path: $msbuild"
          & $msbuild -version

      - name: Install pinned .NET SDK
        if: matrix.dotnet_sdk != 'floating'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet_sdk }}

      - name: Select .NET SDK
        shell: pwsh
        run: |
          $sdk = "${{ matrix.dotnet_sdk }}"
          $reproRoot = Join-Path $env:GITHUB_WORKSPACE ".github\repro\appx-dependency"
          $globalJson = Join-Path $reproRoot "global.json"

          if ($sdk -eq "floating") {
            Remove-Item -Path $globalJson -Force -ErrorAction SilentlyContinue
            Write-Host "No global.json written. SDK resolution floats, matching the reporter's setup."
          } else {
            $content = [ordered]@{
              sdk = [ordered]@{
                version     = $sdk
                rollForward = "disable"
              }
            } | ConvertTo-Json

            Set-Content -Path $globalJson -Value $content -Encoding utf8
            Write-Host "Pinned SDK via global.json:"
            Get-Content $globalJson
          }

          Write-Host "--- Installed SDKs ---"
          dotnet --list-sdks

      - name: Resolve build target path
        id: target
        shell: pwsh
        run: |
          $pattern = "${env:REPRO_TARGET_GLOB}"
          Write-Host "Searching for build target with pattern: $pattern"

          $normalizedPattern = $pattern.Replace('/', '\\')
          if ($normalizedPattern.StartsWith('.\\') -or $normalizedPattern.StartsWith('./')) {
            $normalizedPattern = $normalizedPattern.Substring(2)
          }
          $directPath = Join-Path $env:GITHUB_WORKSPACE $normalizedPattern

          if (Test-Path $directPath) {
            $targetPath = (Resolve-Path $directPath).Path
            Write-Host "Using direct build target path: $targetPath"
            "path=$targetPath" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $allTargets = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Force |
            Where-Object { $_.Extension -in @('.sln', '.slnx', '.wapproj', '.csproj') }

          $files = $allTargets | Where-Object {
            $relative = $_.FullName.Substring($env:GITHUB_WORKSPACE.Length).TrimStart('\\')
            $relative -like $normalizedPattern -or $_.Name -like $normalizedPattern
          }

          if (-not $files -or $files.Count -eq 0) {
            Write-Host "No match for pattern '$pattern'."
            Write-Host "Searched direct path: $directPath"
            Write-Host "Available build targets:"
            $allTargets | ForEach-Object {
              $relative = $_.FullName.Substring($env:GITHUB_WORKSPACE.Length).TrimStart('\\')
              Write-Host "  - $relative"
            }
            throw "No build target files found for pattern: $pattern"
          }

          $targetPath = $files | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Using matched build target path: $targetPath"
          "path=$targetPath" >> $env:GITHUB_OUTPUT

      - name: Restore
        shell: pwsh
        run: |
          $target = "${{ steps.target.outputs.path }}"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -requires Microsoft.VisualStudio.ComponentGroup.MSIX.Packaging -property installationPath
          $msbuild = Join-Path $installPath "MSBuild\Current\Bin\MSBuild.exe"

          & $msbuild $target /t:Restore /p:Configuration=Release /p:Platform=x64 /m /bl:restore.binlog

      - name: Build and package (issue-like args)
        shell: pwsh
        run: |
          $target = "${{ steps.target.outputs.path }}"
          $appxDir = Join-Path $env:GITHUB_WORKSPACE "${env:REPRO_APPX_PACKAGE_DIR}"

          New-Item -Path $appxDir -ItemType Directory -Force | Out-Null

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -requires Microsoft.VisualStudio.ComponentGroup.MSIX.Packaging -property installationPath
          $msbuild = Join-Path $installPath "MSBuild\Current\Bin\MSBuild.exe"

          & $msbuild $target `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxBundlePlatforms="x64" `
            /p:AppxPackageDir="$appxDir" `
            /p:AppxBundle=Always `
            /p:UapAppxPackageBuildMode=SideLoadOnly `
            /p:AppxPackageSigningEnabled=false `
            /p:Company="Our Company" `
            /m `
            /bl:build.binlog

      - name: Inspect package contents for dependency
        id: verify
        shell: pwsh
        run: |
          $appxDir = Join-Path $env:GITHUB_WORKSPACE "${env:REPRO_APPX_PACKAGE_DIR}"
          $dependency = "${env:REPRO_DEPENDENCY_DLL}"

          $packages = Get-ChildItem -Path $appxDir -Recurse -File -Include *.appx,*.msix,*.appxbundle,*.msixbundle
          if (-not $packages -or $packages.Count -eq 0) {
            throw "No package files were produced under: $appxDir"
          }

          New-Item -Path .\extracted -ItemType Directory -Force | Out-Null
          $found = $false

          function Expand-NestedPackages {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Root
            )

            $archives = Get-ChildItem -Path $Root -Recurse -File |
              Where-Object { $_.Extension -in @('.appx', '.msix', '.appxbundle', '.msixbundle') }

            foreach ($archive in $archives) {
              $zipPath = "$($archive.FullName).zip"
              if (Test-Path $zipPath) {
                continue
              }

              $extractDir = Join-Path $archive.DirectoryName "$($archive.BaseName)_expanded"
              New-Item -Path $extractDir -ItemType Directory -Force | Out-Null

              Copy-Item $archive.FullName $zipPath -Force
              Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
            }
          }

          foreach ($pkg in $packages) {
            $target = Join-Path .\extracted $pkg.BaseName
            New-Item -Path $target -ItemType Directory -Force | Out-Null

            Copy-Item $pkg.FullName (Join-Path $target ($pkg.Name + ".zip")) -Force
            Expand-Archive -Path (Join-Path $target ($pkg.Name + ".zip")) -DestinationPath $target -Force

            # Bundles can contain nested appx/msix archives. Expand nested layers twice.
            Expand-NestedPackages -Root $target
            Expand-NestedPackages -Root $target

            $match = Get-ChildItem -Path $target -Recurse -File -Filter $dependency -ErrorAction SilentlyContinue
            if ($match) {
              $found = $true
              Write-Host "FOUND $dependency in package: $($pkg.FullName)"
              $match | ForEach-Object { Write-Host "  -> $($_.FullName)" }
            } else {
              Write-Host "MISSING $dependency in package: $($pkg.FullName)"
            }
          }

          "dependency_found=$found" >> $env:GITHUB_OUTPUT

      - name: Save summary
        shell: pwsh
        run: |
          $image = "${{ matrix.image }}"
          $requested = "${{ matrix.dotnet_sdk }}"
          $found = "${{ steps.verify.outputs.dependency_found }}"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -requires Microsoft.VisualStudio.ComponentGroup.MSIX.Packaging -property installationPath
          $msbuild = Join-Path $installPath "MSBuild\Current\Bin\MSBuild.exe"
          $csproj = Join-Path $env:GITHUB_WORKSPACE ".github\repro\appx-dependency\src\ReproWpfApp\ReproWpfApp.csproj"

          $msbuildSdk = & $msbuild $csproj -getProperty:NETCoreSdkVersion -nologo 2>&1 | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) {
            $msbuildSdk = "(could not resolve: $msbuildSdk)"
          }

          "# Appx Dependency Repro Summary ($image / SDK $requested)" | Out-File -FilePath summary.md -Encoding utf8
          "" | Out-File -FilePath summary.md -Append -Encoding utf8
          "- Runner Image: $env:ImageOS" | Out-File -FilePath summary.md -Append -Encoding utf8
          "- Image Version: $env:ImageVersion" | Out-File -FilePath summary.md -Append -Encoding utf8
          "- Requested SDK: $requested" | Out-File -FilePath summary.md -Append -Encoding utf8
          "- SDK Used By MSBuild: $msbuildSdk" | Out-File -FilePath summary.md -Append -Encoding utf8
          "- Build Target Glob: $env:REPRO_TARGET_GLOB" | Out-File -FilePath summary.md -Append -Encoding utf8
          "- Dependency Checked: $env:REPRO_DEPENDENCY_DLL" | Out-File -FilePath summary.md -Append -Encoding utf8
          "- Dependency Found In Package: $found" | Out-File -FilePath summary.md -Append -Encoding utf8

          Get-Content .\summary.md

      - name: Upload diagnostics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-${{ matrix.image }}-sdk-${{ matrix.dotnet_sdk }}
          if-no-files-found: warn
          path: |
            vs-instances.json
            summary.md
            restore.binlog
            build.binlog
            extracted/**
            ${{ env.REPRO_APPX_PACKAGE_DIR }}

      - name: Fail if dependency missing
        if: steps.verify.outputs.dependency_found != 'True'
        shell: pwsh
        run: |
          throw "Dependency $env:REPRO_DEPENDENCY_DLL was not found in package on ${{ matrix.image }} (SDK ${{ matrix.dotnet_sdk }})"
