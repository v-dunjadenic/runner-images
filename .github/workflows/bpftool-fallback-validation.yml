name: BPFTool Fallback Validation

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bpftool-fallback-validation.yml

jobs:
  validate-bpftool-fallback:
    name: Validate bpftool fallback on Ubuntu 24.04
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Verify bpftool and apply minimal fallback
        shell: bash
        run: |
          set -euo pipefail

          KREL="$(uname -r)"
          WRAPPER="/usr/sbin/bpftool"
          LOG_FILE="$RUNNER_TEMP/bpftool-fallback.log"
          TMPDIR="$(mktemp -d)"
          trap 'rm -rf "$TMPDIR"' EXIT

          log() {
            echo "$*" | tee -a "$LOG_FILE"
          }

          : > "$LOG_FILE"
          log "=== bpftool fallback validation ==="
          log "Runner OS: ${RUNNER_OS}"
          log "Kernel release: ${KREL}"
          log "Wrapper path: ${WRAPPER}"

          if "$WRAPPER" -V >/dev/null 2>&1; then
            log "bpftool already works on this runner. No fallback required."
            exit 0
          fi

          log "bpftool wrapper failed; attempting to stage a real executable from the matching kernel tools package."
          sudo apt-get update

          staged_binary=""
          for package_name in "linux-tools-${KREL}" linux-tools-azure; do
            log "Trying package: ${package_name}"

            if ! apt-get download "$package_name" >/dev/null 2>&1; then
              log "Unable to download ${package_name}."
              continue
            fi

            deb_file="$(find . -maxdepth 1 -name "${package_name}_*.deb" | sort | tail -n 1)"
            if [[ -z "$deb_file" ]]; then
              log "Downloaded ${package_name} but no .deb file was found."
              continue
            fi

            mkdir -p "$TMPDIR/extracted"
            dpkg-deb -x "$deb_file" "$TMPDIR/extracted" >/dev/null 2>&1

            candidate="$(find "$TMPDIR/extracted" -type f -name bpftool -perm -111 2>/dev/null | sort | tail -n 1)"
            if [[ -z "$candidate" ]]; then
              log "${package_name} did not contain a usable bpftool executable."
              continue
            fi

            if ! "$candidate" -V >/dev/null 2>&1; then
              log "Candidate from ${package_name} did not execute as bpftool."
              continue
            fi

            staged_binary="/usr/local/bin/bpftool"
            sudo install -m 0755 "$candidate" "$staged_binary"
            sudo mkdir -p "/usr/lib/linux-tools/${KREL}"
            sudo ln -sf "$staged_binary" "/usr/lib/linux-tools/${KREL}/bpftool"
            log "Staged real bpftool binary from ${package_name}: ${staged_binary}"
            break
          done

          if [[ -z "$staged_binary" ]]; then
            log "No usable bpftool binary could be staged from the kernel tools packages."
            log "This runner image needs an upstream packaging fix or a prebuilt bpftool binary source."
            exit 1
          fi

          BPFT_VERSION_OUTPUT="$($WRAPPER -V 2>&1)"
          log "bpftool -V output: ${BPFT_VERSION_OUTPUT}"

          if [[ "$BPFT_VERSION_OUTPUT" != bpftool\ v* ]]; then
            log "bpftool validation failed after fallback staging."
            exit 1
          fi

          log "Kernel expected path target: $(readlink -f "/usr/lib/linux-tools/${KREL}/bpftool" 2>/dev/null || echo missing)"
          log "Fallback applied: true"

          {
            echo "## BPFTool Fallback Validation"
            echo ""
            echo "- Kernel release: ${KREL}"
            echo "- Fallback applied: true"
            echo "- bpftool check: success"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: bpftool-fallback-diagnostics
          path: ${{ runner.temp }}/bpftool-fallback.log
