name: BPFTool Fallback Validation

on:
  workflow_dispatch:
    inputs:
      force_fallback:
        description: "Remove the expected bpftool path first to force the fallback logic to run, even on images where bpftool already works."
        type: boolean
        default: false
  push:
    paths:
      - .github/workflows/bpftool-fallback-validation.yml

jobs:
  validate-bpftool-fallback:
    name: Validate bpftool fallback on Ubuntu 24.04
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    env:
      LOG_FILE: ${{ github.workspace }}/bpftool-fallback.log

    steps:
      - name: Diagnose runner bpftool state
        shell: bash
        run: |
          set -uo pipefail
          KREL="$(uname -r)"
          {
            echo "=== bpftool diagnostics ==="
            echo "Runner OS:        ${RUNNER_OS}"
            echo "Kernel release:   ${KREL}"
            echo
            echo "--- Out-of-the-box: /usr/sbin/bpftool -V ---"
            /usr/sbin/bpftool -V 2>&1 || echo "(bpftool wrapper failed as expected for this kernel)"
            echo
            echo "--- Existing bpftool payloads under /usr/lib ---"
            find /usr/lib -type f -name bpftool 2>/dev/null || true
            echo
            echo "--- apt candidates for tools packages ---"
            apt-cache policy linux-tools-generic linux-tools-azure "linux-tools-${KREL}" 2>/dev/null \
              | grep -E 'linux-tools|Candidate|Installed' || true
          } | tee "$LOG_FILE"

      - name: Ensure bpftool works on current kernel (workaround under test)
        shell: bash
        env:
          FORCE_FALLBACK: ${{ inputs.force_fallback }}
        run: |
          # ----------------------------------------------------------------
          # This is the exact snippet suggested to users in issue #14203.
          # It is idempotent and a safe no-op when bpftool already works.
          # ----------------------------------------------------------------
          set -euo pipefail
          KREL="$(uname -r)"

          # Optional: simulate the broken state on images that already work,
          # so the POC exercises the fallback path regardless of image version.
          if [[ "${FORCE_FALLBACK:-false}" == "true" ]]; then
            echo "force_fallback=true: removing any existing ${KREL} bpftool link to simulate the bug."
            sudo rm -f "/usr/lib/linux-tools/${KREL}/bpftool"
          fi

          if ! /usr/sbin/bpftool -V >/dev/null 2>&1; then
            echo "bpftool wrapper fails for kernel ${KREL}; applying fallback."

            # The kernel-matched Azure tools package is currently missing the
            # bpftool binary (LP#2154331). Make sure a real bpftool binary is
            # present by installing the generic linux-tools line, which ships it.
            if ! find /usr/lib -type f -name bpftool -perm -111 2>/dev/null | grep -q .; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends linux-tools-generic
            fi

            FALLBACK="$(find /usr/lib -type f -name bpftool -perm -111 2>/dev/null | sort -V | tail -n 1)"
            if [[ -z "${FALLBACK}" ]]; then
              echo "No bpftool payload found under /usr/lib after install." >&2
              exit 1
            fi

            echo "Linking bpftool fallback: ${FALLBACK}"
            sudo mkdir -p "/usr/lib/linux-tools/${KREL}"
            sudo ln -sf "${FALLBACK}" "/usr/lib/linux-tools/${KREL}/bpftool"
          fi

          # Must succeed now.
          /usr/sbin/bpftool -V

      - name: Verify and summarize
        shell: bash
        run: |
          set -euo pipefail
          KREL="$(uname -r)"
          OUT="$(/usr/sbin/bpftool -V 2>&1)"
          echo "bpftool -V => ${OUT}" | tee -a "$LOG_FILE"

          if [[ "${OUT}" != bpftool\ v* ]]; then
            echo "bpftool validation FAILED after workaround." >&2
            exit 1
          fi

          TARGET="$(readlink -f "/usr/lib/linux-tools/${KREL}/bpftool" 2>/dev/null || echo 'n/a (wrapper resolved without fallback)')"
          {
            echo "## BPFTool Fallback Validation"
            echo ""
            echo "- Kernel release: \`${KREL}\`"
            echo "- bpftool version: \`${OUT%%$'\n'*}\`"
            echo "- Resolved binary: \`${TARGET}\`"
            echo "- Result: success"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: bpftool-fallback-diagnostics
          path: ${{ runner.temp }}/bpftool-fallback.log
